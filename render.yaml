envVarGroups:
  - name: matrix-shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  # 🟢 Node API (Estadísticas)
  - type: web
    name: node-api
    runtime: docker
    dockerContext: .
    dockerfilePath: node-api/Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - fromGroup:
          name: matrix-shared-secrets

  # 🔵 Go API (Cálculo QR y Rotación)
  - type: web
    name: go-api
    runtime: docker
    dockerContext: .
    dockerfilePath: go-api/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_API_URL
        fromService:
          type: web
          name: node-api
          property: host
      - key: ALLOWED_ORIGIN
        value: "*"
      - fromGroup:
          name: matrix-shared-secrets

  # 🎨 Frontend (Static Site)
  - type: web
    name: matrix-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_GO_API_BASE
        fromService:
          type: web
          name: go-api
          property: host
